    <script id="v-shader-nolight" type="x-shader/x-vertex">
        precision mediump float;

        attribute vec3 vertexPosition; 
        attribute vec3 vertexColor;   

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;

        varying vec3 fragmentColor;   

        void main() {
            gl_Position = projectionMatrix * modelViewMatrix * vec4(vertexPosition, 1.0); 
            fragmentColor = vertexColor; 
        }
    </script>

    <script id="v-shader-gouraudspecular" type="x-shader/x-vertex">
        precision mediump float;

        attribute vec3 vertexPosition; 
        attribute vec3 vertexColor;    
        attribute vec3 vertexNormal;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;
        uniform mat3 normalMatrix;
        uniform vec4 lightViewPosition;
        uniform vec3 cameraPosition;
        uniform vec4 lightColor;

        uniform float ambientCoefficient;
        uniform float diffuseCoefficient;
        uniform float specularCoefficient;

        varying vec3 fragmentColor;  

        void main() {
            vec4 viewPosition = modelViewMatrix * vec4(vertexPosition, 1.0);
            vec3 lightVector = normalize(lightViewPosition.xyz - viewPosition.xyz);
            vec3 viewVector = normalize(cameraPosition.xyz - viewPosition.xyz);
            vec3 normal = normalize(normalMatrix * vertexNormal);

            float d = max(dot(normal, lightVector), 0.0);
            vec3 diffuse = d*vertexColor*lightColor.xyz*diffuseCoefficient;

            float nl = dot(normal, lightVector);
            vec3 reflectionVector = 2.0*nl*normal - lightVector;

            float ERn = pow(max(dot(reflectionVector, viewVector), 0.0), 10.0);
            vec3 specular = ERn * lightColor.xyz * specularCoefficient;

            if (d < 0.0){
                specular = vec3(0.0,0.0,0.0);
            }

            vec3 ambientLight = vec3(0.1,0.1,0.1);
            vec3 ambient = ambientLight*vertexColor*ambientCoefficient;

            fragmentColor = ambient + diffuse + specular;
            gl_Position = projectionMatrix * viewPosition; 
        }
    </script>

    <script id="v-shader-phong" type="x-shader/x-vertex">
        attribute vec3 vertexPosition;
        attribute vec3 vertexNormal;
        attribute vec3 vertexColor;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;
        uniform mat3 normalMatrix;
        uniform vec4 lightViewPosition;
        uniform vec3 cameraPosition;

        varying vec3 normalVector;
        varying vec3 viewVector;
        varying vec3 colorVector;
        varying vec3 lightVector;

        void main() {
            normalVector = normalize(normalMatrix * vertexNormal);
            colorVector = vertexColor;
            vec4 viewPosition = modelViewMatrix * vec4(vertexPosition, 1.0);
            viewVector = normalize(cameraPosition - viewPosition.xyz);
            lightVector = normalize(lightViewPosition.xyz - viewPosition.xyz);
            gl_Position = projectionMatrix * viewPosition;
        }
    </script>

    <script id="f-shader-phongspecular" type="x-shader/x-fragment">
        precision mediump float;

        varying vec3 viewVector;
        varying vec3 normalVector;
        varying vec3 colorVector;
        varying vec3 lightVector;

        uniform float ambientCoefficient;
        uniform float diffuseCoefficient;
        uniform float specularCoefficient;

        uniform vec4 lightColor;
        uniform float time;

        void main() {
            vec3 normal = normalize(normalVector);
            vec3 light = normalize(lightVector);
            vec3 view = normalize(viewVector);

            float nl = dot(normal, light);
            vec3 reflectionVector = 2.0*nl*normal - light;


            float d = max(dot(normal, light), 0.0);
            vec3 diffuse = d*colorVector*lightColor.xyz*diffuseCoefficient;

            float ERn = pow(max(dot(reflectionVector, view), 0.0), 10.0); 
            vec3 specular = ERn * lightColor.xyz * specularCoefficient;

            vec3 ambientLight = vec3(0.1,0.1,0.1);
            vec3 ambient = ambientLight*colorVector*ambientCoefficient;

            vec3 fragmentColor = ambient + diffuse + specular;

            // Bonus
            float pulse = 0.5 + 0.3*sin(time);
            vec3 pulseColor = mix(colorVector, lightColor.xyz, pulse);
            fragmentColor *= pulseColor;

            gl_FragColor = vec4(fragmentColor, 1.0);
        }

    </script>

    <script id="f-shader" type="x-shader/x-fragment">
        precision mediump float;
        uniform float time;
        uniform vec4 lightColor;

        varying vec3 fragmentColor;
    
        void main() {
            // Bonus
            float pulse = 0.5 + 0.3*sin(time);
            vec3 vColor = fragmentColor;
            vec3 pulseColor = mix(vColor, lightColor.xyz, pulse);
            vColor *= pulseColor;

            gl_FragColor = vec4(vColor, 1.0);
           
        }
    </script>
